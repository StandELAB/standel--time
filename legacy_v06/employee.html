<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142339"><title>StandEL Time · Сотрудник</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18324d}*{box-sizing:border-box}body{margin:0;background:#eef4fb;min-height:100vh}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(30deg,transparent 0 170px,#8dadd4 171px,#8dadd4 172px,transparent 173px 240px)}header{position:relative;background:#142339;padding:14px 24px;color:white;display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap}header img{background:#fff;border-radius:10px;padding:6px;width:105px}header h1{font-size:21px;margin:0}header select{border:1px solid #dae2ec;border-radius:9px;padding:9px}main{position:relative;max-width:960px;margin:auto;padding:24px 16px}.card{background:#fffffff2;border:1px solid #dae5ef;box-shadow:0 8px 24px #132a4410;padding:22px;border-radius:16px;margin-bottom:16px}.card h2{margin:0 0 15px;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{font:inherit;cursor:pointer}.tabs button,.btn{background:#165fb9;border:0;border-radius:10px;color:white;padding:11px 16px;font-weight:700}.tabs button{background:#dfeaf7;color:#16416e}.tabs button.active{background:#165fb9;color:#fff}.btn.secondary{background:#dfeaf7;color:#16416e}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #bfcfe0;border-radius:9px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:78px}.hidden{display:none!important}.hint{background:#e8f2fd;padding:13px;border-radius:10px;font-size:13px}.record{padding:13px;border:1px solid #dae5ef;border-left:5px solid var(--pc,#1864bd);margin:8px 0;border-radius:9px}.muted{color:#65778d;font-size:13px}.success{color:#087958;font-weight:650}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #d5e2ee;background:#fff;border-radius:7px;min-height:65px;padding:7px;font-size:12px;overflow:hidden}.day.today{outline:2px solid #1369ca}.day b{display:block}.day small{display:block;margin-top:5px;overflow-wrap:anywhere}.day.sick{background:#ffe7e6}.day.personal{background:#fff1d9}.day.vacation{background:#e7f2ff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top button{margin:2px}#auth{max-width:600px;margin:50px auto}.notice{color:#775a1b;background:#fff8df;padding:12px;border-radius:10px;font-size:13px}@media(max-width:540px){.fields{grid-template-columns:1fr}.day{min-height:49px;font-size:10px;padding:4px}main{padding:12px}.card{padding:15px}header{padding:12px}}
</style></head><body><header><img src="assets/standel-logo.png" alt="StandEL"><div><h1>StandEL Time</h1><div class="muted" style="color:#ceddf1">Employee workspace</div></div><select id="language"><option value="ru">Русский</option><option value="sv">Svenska</option><option value="en">English</option></select></header><main>
<section id="auth"><div class="card"><h2 id="authTitle"></h2><p id="authText" class="hint"></p><div id="authControls"></div></div></section>
<section id="workspace" class="hidden"><div class="top"><h2 id="greeting"></h2><button class="btn secondary" id="signout"></button></div><div class="tabs"><button data-view="hours" class="active"></button><button data-view="calendar"></button><button data-view="records"></button></div>
<div id="hours" class="view"><div class="card"><h2 id="hoursTitle"></h2><div class="field"><label id="modeText"></label><select id="entryMode"><option value="manual"></option><option value="timer"></option></select></div><div class="field"><label id="projectText"></label><select id="project"></select></div><div class="fields"><div class="field"><label id="dateText"></label><input id="date" type="date"></div><div class="field"><label id="breakText"></label><input id="breaks" type="number" min="0" max="1440" value="60"></div></div><div id="manualGroup" class="fields"><div class="field"><label id="startText"></label><input type="time" id="start" value="07:00"></div><div class="field"><label id="endText"></label><input type="time" id="end" value="16:00"></div></div><div class="hidden" id="timerGroup"><p id="timerDisplay">00:00:00</p><button class="btn" id="timerButton"></button></div><div class="field"><label id="categoryText"></label><select id="category"><option value="regular"></option><option value="overtime"></option><option value="ob"></option></select></div><div class="field"><label id="notesText"></label><textarea id="notes"></textarea></div><button class="btn" id="saveEntry"></button><p id="workMessage" role="status" class="success"></p></div></div>
<div id="calendar" class="view hidden"><div class="card"><div class="top"><h2 id="calendarTitle"></h2><div><button class="btn secondary" id="prev">◀</button><strong id="month"></strong><button class="btn secondary" id="next">▶</button><button class="btn secondary" id="today"></button></div></div><div id="calendarDays" class="grid"></div></div><div class="card"><h2 id="absenceTitle"></h2><div class="fields"><div class="field"><label id="fromText"></label><input id="from" type="date"></div><div class="field"><label id="toText"></label><input id="to" type="date"></div></div><div class="field"><label id="absenceTypeText"></label><select id="absenceType"><option value="sick"></option><option value="personal"></option><option value="vacation"></option></select></div><div class="field"><label id="absenceNotesText"></label><textarea id="absenceNotes"></textarea></div><button class="btn" id="requestAbsence"></button><p id="absenceMessage" class="success"></p></div></div>
<div id="records" class="view hidden"><div class="card"><h2 id="recordsTitle"></h2><div id="recordsList"></div><h2 id="requestsTitle"></h2><div id="requestsList"></div></div></div>
<p class="notice" id="demoNote"></p></section></main><script src="employee.js"></script></body></html>
